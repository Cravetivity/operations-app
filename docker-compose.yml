services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ops:${POSTGRES_PASSWORD:-ops}@postgres:5432/ops
      SPOOLMAN_URL: ${SPOOLMAN_URL:-http://spoolman:8000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    ports:
      - "${SPOOLMAN_PORT:-7912}:8000"
    volumes:
      - spoolman-data:/home/app/.local/share/spoolman
    restart: unless-stopped

  # Development only (docker compose --profile dev up): fake BamBuddy with
  # simulated printers so the printer wall can be built without hardware.
  mock-bambuddy:
    build: dev/mock-bambuddy
    profiles: ["dev"]
    ports:
      - "8580:8000"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops}
      POSTGRES_DB: ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  spoolman-data:
